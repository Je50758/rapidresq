# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=RapidResQ-Web

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:disasterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Donor PII encryption (AES-256-GCM). Base64-encoded 32-byte key.
# Generate one with: openssl rand -base64 32
rrq.encryption-key=3nR7xQ2mLf8YsK1vB4dZ9aW6cE0hT5uJgP3oN8iM7kA=

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
