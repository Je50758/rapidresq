<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | RapidResQ</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background-color: var(--bg-page); min-height: 100vh; display: flex; flex-direction: column;">
  <div id="navbar-placeholder"></div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.25rem; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="brand-badge" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 1rem;">🛡️</span>
        <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--primary);">Sign in to RapidResQ</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
          Access the National Disaster Response Portal
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. admin or citizen1" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
          Sign In to Portal
        </button>
      </form>

      <div style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light);">
        <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-dim); text-align: center; margin-bottom: 0.75rem;">
          ⚡ Instant Demo Credentials
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="quickFill('admin', 'admin123')">
            👑 Admin
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="quickFill('citizen1', 'pass123')">
            👤 Citizen
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="quickFill('volunteer1', 'pass123')">
            🤝 Volunteer
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="quickFill('team1', 'pass123')">
            🚒 Response Unit
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RapidResQ.renderNavbar('login');

      // If already logged in, redirect
      if (RapidResQ.isAuthenticated()) {
        window.location.href = '/dashboard.html';
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;

        try {
          const res = await RapidResQ.api.login(u, p);
          RapidResQ.showToast(`Welcome back, ${res.username}! (${res.role})`, 'success');
          
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/dashboard.html';
          setTimeout(() => window.location.href = redirect, 500);
        } catch (err) {
          RapidResQ.showToast(err.message || 'Login failed. Please check credentials.', 'error');
        }
      });
    });

    function quickFill(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
